# Publie le site : branche main à la racine, branche dev dans /dev/
#   main → https://hugolpr07.github.io/Gym-app/
#   dev  → https://hugolpr07.github.io/Gym-app/dev/
name: Pages (main + dev)

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: site
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev
          path: site/dev
      # Contrôle avant publication : si l'app ne se compile pas ou si un test échoue, rien n'est publié
      # (le site garde la version précédente). Le contrôle de dev sert pour les deux branches.
      - name: Contrôle (scripts/check.mjs + tests)
        run: |
          node --version
          for d in site site/dev; do node site/dev/scripts/check.mjs "$d"; done
          node --test site/dev/tests/*.test.mjs
          if [ -d site/tests ]; then node --test site/tests/*.test.mjs; fi
      - run: rm -rf site/.git site/.github site/scripts site/tests site/dev/.git site/dev/.github site/dev/scripts site/dev/tests
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
